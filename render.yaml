# Temporary demonstration only. Local accounts, requests and uploads may be lost on restart.
services:
  - type: web
    name: midway-branch-workspace
    runtime: node
    plan: free
    numInstances: 1
    autoDeploy: false
    buildCommand: bash deploy/build.sh
    startCommand: bash deploy/start-demo.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MIDWAY_DATABASE_URL
        value: file:/tmp/midway-demo/workspace.db
      - key: MIDWAY_DEMO_MODE
        value: "true"
      - key: MIDWAY_SECURE_COOKIES
        value: "true"
      - key: MIDWAY_ALLOW_SETUP
        value: "true"
      - key: MIDWAY_SETUP_TOKEN
        generateValue: true
